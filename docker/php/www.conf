; Overrides the base php:8.3-fpm-alpine image's default pool, which caps
; concurrency at pm.max_children = 5 regardless of how much CPU/RAM the
; container actually gets — that ceiling, not replica count, is what limits
; throughput per instance. Loaded as zz-www.conf (see Dockerfile) so it's
; read after — and overrides — the default www.conf for the same [www] pool.

[www]
pm = dynamic
; Tuned for a ~1-2 vCPU / 512MB-1GB container. A warm Laravel worker with
; opcache typically sits around 40-60MB RSS, leaving headroom under the app's
; memory_limit=256M ceiling per in-flight request. Scale pm.max_children up
; on bigger nodes: roughly (container_memory_MB - 128) / 50.
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically to bound any per-request memory growth.
pm.max_requests = 500

; Surface worker stdout/stderr through the fpm log — supervisor already ships
; php-fpm's own stdout/stderr to the container's, so this makes app-level
; error_log output visible the same way.
catch_workers_output = yes
