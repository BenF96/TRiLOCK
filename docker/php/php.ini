; Camera snapshot uploads from the ESP32-CAM are validated server-side at 5MB
; (see HardwareApiController::uploadImage); give a small margin for multipart
; overhead so a borderline-sized JPEG isn't rejected by PHP before validation
; even runs.
upload_max_filesize = 8M
post_max_size = 10M

memory_limit = 256M
max_execution_time = 60

; ESP32 devices poll every 15-30s; keep workers from piling up on a slow
; upstream (Supabase) instead of queuing indefinitely.
default_socket_timeout = 30

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC
