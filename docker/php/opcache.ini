opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Never stat files against disk in production — `php artisan optimize` (run
; in docker-entrypoint.sh on boot) caches config/routes/views, and a new image
; is what ships code changes, not a live file edit.
opcache.validate_timestamps = 0

opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
